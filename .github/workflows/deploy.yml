name: Deploy trgovina

# Manually triggered deploy (Actions tab -> "Deploy trgovina" -> Run
# workflow). Deliberately NOT automatic on push — a human presses the button,
# same convention as fans-network and ocenagor-landing.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN — token from the "Edit Cloudflare Workers" template.
#     The same token used by the fans-network / ocenagor-landing workflows
#     works here; it is account-scoped. Zone-level DNS permission becomes
#     necessary only once custom domains are attached.
on:
  workflow_dispatch:

env:
  # Public identifier, not a secret — same account as fans-network.
  CLOUDFLARE_ACCOUNT_ID: a92371cf91375ec80a58c86db49c4cdb

  # QA + fallback host. No custom domains are routed yet (all four shops are
  # pre-live; see wrangler.jsonc for the go-live steps and the 10082 doctrine).
  WORKERS_DEV_HOST: "trgovina.worldfans.workers.dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (freight engine + renderer invariants)
        run: npm test

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The renderer changes with every code change, so content assertions are
      # an honest deploy check for this worker (no static _redirects layer —
      # the file that twice needed a version stamp on ocenagor-landing).
      - name: Smoke test — QA host serves the storefront, noindexed
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/home.html -w "%{http_code}" "https://${WORKERS_DEV_HOST}/") && [ "$code" = "200" ] && break
            echo "attempt $i: HTTP $code — retrying"; sleep 5
          done
          [ "$code" = "200" ] || { echo "workers.dev host did not come up"; exit 1; }
          # Capture-then-grep, never `curl | grep -q`: under pipefail, grep -q
          # exits on first match, curl takes a write error (23) and the
          # pipeline reports failure for a check that PASSED.
          grep -q "Masažni bazen" /tmp/home.html
          curl -s -D /tmp/headers.txt -o /dev/null "https://${WORKERS_DEV_HOST}/"
          grep -qi "x-robots-tag: noindex" /tmp/headers.txt
          # An unknown ?shop override must fall back to the dev shop, not 500.
          # This used to name a second shop; the network is one shop now, so
          # what is left worth checking is the override's failure mode.
          code=$(curl -s -o /tmp/override.html -w "%{http_code}" "https://${WORKERS_DEV_HOST}/?shop=kad")
          [ "$code" = "200" ] || { echo "unknown ?shop override returned $code"; exit 1; }
          grep -q "Masažni bazen" /tmp/override.html
          curl -s -o /tmp/robots.txt "https://${WORKERS_DEV_HOST}/robots.txt"
          grep -q "Disallow: /" /tmp/robots.txt

          # The theme actually renders. Every shop wears studio now, so the
          # default QA page must say so — this catches a tenant config that
          # silently falls back to another theme.
          grep -q 'data-theme="studio"' /tmp/home.html

          # Fonts are SELF-HOSTED. These two greps used to assert the Google
          # Fonts query string ("family=Chivo"), and kept asserting it after
          # the faces were vendored into public/fonts — so the check was
          # testing for the exact thing the change removed. It went unnoticed
          # because the local mirror of these assertions never had them.
          #
          # What matters now is the preload of the real file, and that no
          # third-party font origin has crept back in: a stray @import or a
          # copied <link> would reintroduce the render-blocking cross-origin
          # request the vendoring existed to remove, and the page would still
          # look correct.
          grep -q "/fonts/chivo-500-latin.woff2" /tmp/home.html
          grep -q "@font-face" /tmp/home.html
          for origin in "fonts.googleapis.com" "fonts.gstatic.com" "fontshare"; do
            if grep -qF "$origin" /tmp/home.html; then
              echo "FAIL: third-party font origin '$origin' is back in the shipped page"; exit 1
            fi
          done
          # NOT `! grep …`: POSIX says set -e is ignored for a pipeline
          # beginning with `!`, so that form reports success no matter what and
          # the assertion becomes decoration. Test explicitly and exit.
          #
          # Clash Display and Satoshi were dropped because their Slovenian
          # coverage could not be proven; if either name reappears, so has the
          # bug that put čšž at risk.
          for dead in "Clash Display" "Satoshi"; do
            if grep -qF "$dead" /tmp/home.html; then
              echo "FAIL: unverified face '$dead' is in the shipped page"; exit 1
            fi
          done

          # Slovenian actually renders as Slovenian, not as escapes or tofu.
          grep -q "montaža" /tmp/home.html

          # CSS comments are stripped before the wire. They were 43% of the
          # sheet, and this stylesheet is inlined into every document head.
          if grep -qF "/*" /tmp/home.html; then
            echo "FAIL: CSS comments are reaching the wire"; exit 1
          fi

          # Static assets actually serve. This is a new binding, and a
          # misconfigured one fails silently: the Worker still renders, every
          # <img> just 404s, and the page looks like the placeholders never
          # landed rather than like a broken deploy.
          # Retried, like the page check above. The asset store is eventually
          # consistent: wrangler reported "Uploaded 42 files" and this still
          # 404'd 0.4s later, because the deploy returns before the edge has
          # the objects. A single immediate request tests propagation speed,
          # not configuration.
          icode=000
          for i in 1 2 3 4 5 6; do
            icode=$(curl -s -o /tmp/img.webp -w "%{http_code}" "https://${WORKERS_DEV_HOST}/img/motif-01.webp") || true
            [ "$icode" = "200" ] && break
            echo "asset attempt $i: HTTP $icode — retrying"; sleep 5
          done
          if [ "$icode" != "200" ]; then
            echo "FAIL: /img/motif-01.webp returned $icode after 6 attempts — assets are not serving"; exit 1
          fi
          if ! file /tmp/img.webp | grep -qi "web/p\|webp"; then
            echo "FAIL: /img/motif-01.webp is not a WebP — the Worker answered instead of the asset store"
            head -c 200 /tmp/img.webp; exit 1
          fi

          # Assets must not shadow the page routes.
          grep -q 'data-theme="studio"' /tmp/home.html

          echo "smoke OK"
