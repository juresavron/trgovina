name: Deploy trgovina

# Manually triggered deploy (Actions tab -> "Deploy trgovina" -> Run
# workflow). Deliberately NOT automatic on push — a human presses the button,
# same convention as fans-network and ocenagor-landing.
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN — REQUIRED. Token from the "Edit Cloudflare Workers"
#     template. The same token used by the fans-network / ocenagor-landing
#     workflows works here; it is account-scoped. Zone-level DNS permission
#     becomes necessary only once custom domains are attached.
#   GEMINI_API_KEY — OPTIONAL. Turns on the panel's alt-text writer and its 2K
#     upscaler. Put it HERE, not in the Cloudflare dashboard: a value added
#     there as a plaintext variable is deleted by the next `wrangler deploy`,
#     which replaces the variables block with what wrangler.jsonc declares.
#     That is exactly how it went missing once already. This workflow pushes it
#     to the Worker as an encrypted secret on every deploy, so it cannot drift.
on:
  workflow_dispatch:

env:
  # Public identifier, not a secret — same account as fans-network.
  CLOUDFLARE_ACCOUNT_ID: a92371cf91375ec80a58c86db49c4cdb

  # QA + fallback host, and the one the smoke tests below ask. The bazen shop
  # is live on its own domain (see tenants/bazen.ts); this host stays closed to
  # crawlers by design, which is why the SEO audit asks the shop's own host for
  # robots.txt and the sitemap. See wrangler.jsonc for the go-live steps and
  # the 10082 doctrine.
  WORKERS_DEV_HOST: "trgovina.worldfans.workers.dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # THE SITE'S IMAGE INDEX IS REBUILT FROM THE DATABASE, EVERY DEPLOY.
      #
      # The storefront renders src/themes/studio/own-media.ts rather than
      # querying Supabase, because handleRequest is synchronous and takes no
      # env — a round trip inside it is a different architecture, not a
      # refactor. The index was therefore regenerated by hand, which meant it
      # went stale the moment anyone added or removed a photograph through
      # /admin. In one evening that shipped a deleted picture twice and a
      # broken one once.
      #
      # No secret is involved: the index_build_read policy lets the PUBLISHABLE
      # key read the two tables, and anon's grant on products is narrowed to
      # the three columns the generator selects. Both values are already in
      # wrangler.jsonc as public config, and the script reads them from there.
      #
      # Runs BEFORE typecheck and tests on purpose. The tests assert things
      # about this file — that every URL is in a deliberate cache regime, that
      # a width rung agrees with its own photograph — so they must run against
      # the index being deployed, not the one that happened to be committed.
      #
      # Not fatal. If Supabase is unreachable, deploying the committed index is
      # a worse answer than a fresh one and a much better answer than no
      # deploy, so the step says so and carries on.
      - name: Rebuild the image index from Supabase
        continue-on-error: true
        run: |
          node scripts/sync-media.mjs
          if git diff --quiet -- src/themes/studio/own-media.ts; then
            echo "index already matched the database"
          else
            echo "index changed — the committed copy was stale:"
            git diff --stat -- src/themes/studio/own-media.ts
          fi

      # Reviews are baked in rather than read at request time — see
      # src/content/reviews.generated.ts. They run BEFORE the typecheck and the
      # tests on purpose: a review is an Annex I claim, so the launch gate and
      # the suite should see the real ones and fail the deploy rather than let
      # something reach a customer.
      - name: Rebuild the reviews from Supabase
        continue-on-error: true
        run: |
          node scripts/sync-reviews.mjs
          if git diff --quiet -- src/content/reviews.generated.ts; then
            echo "reviews already matched the database"
          else
            echo "reviews changed — the committed copy was stale:"
            git diff --stat -- src/content/reviews.generated.ts
          fi

      # The colour list is baked in for the same reason the reviews are: the
      # configurator renders inside a synchronous, env-free handleRequest. A
      # colour exists because somebody uploaded its swatch and the name came
      # off the file — see src/catalog/finishes.generated.ts. Fails soft: an
      # unreachable database leaves the committed list alone rather than
      # swapping the shop's real swatches for the transcribed chart.
      - name: Rebuild the colour list from Supabase
        continue-on-error: true
        run: |
          node scripts/sync-finishes.mjs
          if git diff --quiet -- src/catalog/finishes.generated.ts; then
            echo "colours already matched the database"
          else
            echo "colours changed — the committed copy was stale:"
            git diff --stat -- src/catalog/finishes.generated.ts
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (freight engine + renderer invariants)
        run: npm test

      # A ratchet, not a budget: one shop's product vocabulary inside modules
      # every shop renders through. It cannot live in a .test.ts because the
      # Worker tsconfig deliberately has no node types — see the note at the
      # top of the script.
      - name: One shop's words stay out of shared render code
        run: node scripts/audit-shared-copy.mjs

      # Before the deploy, not after: a page in public/ would answer on every
      # routed host — the alias domains included — without the Worker ever
      # running, and the smoke test below only ever asks the QA host.
      - name: public/ ships assets, not pages
        run: node scripts/audit-public-assets.mjs

      # The admin's colours come from design.ts or they are not colours the
      # panel is allowed to have — see the file's own note on why a grey
      # nobody chose is a contrast ratio nobody checked.
      - name: The admin speaks one vocabulary
        run: node scripts/audit-admin-design.mjs

      # A dependency on the database is invisible from the TypeScript: the
      # call compiles and every stubbed test passes whether or not the object
      # exists. This is the only thing that reads src/ and db/schema.sql
      # against each other.
      - name: Every database object the code calls is in the schema
        run: node scripts/audit-db-contract.mjs

      # What a CRAWLER sees, on the shop's own host: titles that fit a SERP,
      # one canonical per page, no duplicate title or h1, every guide in the
      # sitemap, robots.txt open now that the shop is live. It ran only by
      # hand until this line, which is how its robots.txt check spent the
      # whole launch reporting a correct file as an error.
      - name: A crawler gets a whole site
        run: node scripts/audit-seo.mjs

      # Every shop, not just the first. The audit takes the shop as a
      # parameter for exactly this reason: a second storefront could otherwise
      # ship with its titles, descriptions, heading trees and link graph
      # unaudited, and nothing would have said so. Pre-live shops are audited
      # too — the point is to be right BEFORE the flag flips.
      - name: The second shop gets one too
        run: AUDIT_SHOP=vrecke node scripts/audit-seo.mjs

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # THE ONE SECRET, PUT WHERE A DEPLOY CANNOT LOSE IT.
      #
      # The panel reported "nastavljen ni GEMINI_API_KEY" on a live deploy
      # after the key had been added, which has two causes and they look
      # identical from the outside:
      #
      #   1. It was added as a GitHub repository secret. Cloudflare never
      #      sees those — `wrangler deploy` uploads the script and the vars
      #      block, and nothing else.
      #   2. It was added in the Cloudflare dashboard as a plaintext
      #      VARIABLE rather than an encrypted SECRET. `wrangler deploy`
      #      replaces the variables with what wrangler.jsonc declares, so
      #      every deploy after that quietly deleted it.
      #
      # Either way the feature switched itself off and the only signal was a
      # line of grey text in the panel. Pushing it from the repository secret
      # on every deploy makes its presence declarative: it survives a deploy,
      # it survives the dashboard, and it is re-established from the one
      # place the CLOUDFLARE_API_TOKEN already lives.
      #
      # An absent secret is NOT a failure. The feature is optional by design
      # — no key means stand-in descriptions and no upscaling, which is a
      # working shop. Failing the deploy over it would be worse than the bug.
      - name: Put GEMINI_API_KEY on the Worker
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "No GEMINI_API_KEY repository secret — skipping."
            echo "The panel will write stand-in descriptions and will not upscale."
            exit 0
          fi
          # printf, not echo: echo appends a newline, and a trailing newline in
          # an API key is a 400 from Google that reads like a bad key.
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          # Prove it landed. `secret list` prints names, never values.
          npx wrangler secret list > /tmp/secrets.json
          if ! grep -q "GEMINI_API_KEY" /tmp/secrets.json; then
            echo "FAIL: the secret did not stick"; exit 1
          fi
          echo "GEMINI_API_KEY is on the Worker."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # THE KEY BEING PRESENT IS NOT THE KEY WORKING.
      #
      # A valid-looking key can be rejected, restricted to the wrong API, or
      # simply be pointed at a preview model that has since been renamed —
      # and every one of those failures looks the same from the shop, because
      # the Worker is built to fall back rather than break. So the deploy asks
      # Google directly and prints which of the three parts answer.
      #
      # Deliberately NOT --strict: a Google outage must not fail a deploy for
      # an optional feature. This is a report, and the report is the point.
      - name: Check the Gemini integration
        continue-on-error: true
        run: node scripts/check-gemini.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # The renderer changes with every code change, so content assertions are
      # an honest deploy check for this worker (no static _redirects layer —
      # the file that twice needed a version stamp on ocenagor-landing).
      - name: Smoke test — QA host serves the storefront, noindexed
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/home.html -w "%{http_code}" "https://${WORKERS_DEV_HOST}/") && [ "$code" = "200" ] && break
            echo "attempt $i: HTTP $code — retrying"; sleep 5
          done
          [ "$code" = "200" ] || { echo "workers.dev host did not come up"; exit 1; }
          # Capture-then-grep, never `curl | grep -q`: under pipefail, grep -q
          # exits on first match, curl takes a write error (23) and the
          # pipeline reports failure for a check that PASSED.
          grep -q "Masažni bazen" /tmp/home.html
          curl -s -D /tmp/headers.txt -o /dev/null "https://${WORKERS_DEV_HOST}/"
          grep -qi "x-robots-tag: noindex" /tmp/headers.txt
          # An unknown ?shop override must fall back to the dev shop, not 500.
          # This used to name a second shop; the network is one shop now, so
          # what is left worth checking is the override's failure mode.
          code=$(curl -s -o /tmp/override.html -w "%{http_code}" "https://${WORKERS_DEV_HOST}/?shop=kad")
          [ "$code" = "200" ] || { echo "unknown ?shop override returned $code"; exit 1; }
          grep -q "Masažni bazen" /tmp/override.html
          curl -s -o /tmp/robots.txt "https://${WORKERS_DEV_HOST}/robots.txt"
          grep -q "Disallow: /" /tmp/robots.txt

          # The theme actually renders. Every shop wears studio now, so the
          # default QA page must say so — this catches a tenant config that
          # silently falls back to another theme.
          grep -q 'data-theme="studio"' /tmp/home.html

          # Fonts are SELF-HOSTED. These two greps used to assert the Google
          # Fonts query string ("family=Chivo"), and kept asserting it after
          # the faces were vendored into public/fonts — so the check was
          # testing for the exact thing the change removed. It went unnoticed
          # because the local mirror of these assertions never had them.
          #
          # What matters now is the preload of the real file, and that no
          # third-party font origin has crept back in: a stray @import or a
          # copied <link> would reintroduce the render-blocking cross-origin
          # request the vendoring existed to remove, and the page would still
          # look correct.
          grep -q "/fonts/chivo-500-latin.woff2" /tmp/home.html
          # THE STYLESHEET IS A FILE NOW (render/assets.ts): the page links
          # /assets/site-<hash>.css instead of inlining 142 kB, so the font
          # and rule assertions read the asset the page actually references.
          css_path=$(grep -o '/assets/site-[0-9a-f]*\.css' /tmp/home.html | head -1)
          [ -n "$css_path" ] || { echo "FAIL: page links no stylesheet asset"; exit 1; }
          # Retried like the page check above, and for the same reason: right
          # after a deploy, different connections can land on colos running
          # different worker versions — the page came from the new one and
          # this request 404'd off the old one, once, in the run that added
          # this loop.
          # -L: a 302 here is the stale-hash SELF-HEAL working — during
          # propagation the old worker answers the new hash with a redirect
          # to its own current asset. Following it lands on real CSS either
          # way; the @font-face grep below proves the body is the sheet.
          for i in 1 2 3 4 5; do
            code=$(curl -sL -o /tmp/site.css -w "%{http_code}" "https://${WORKERS_DEV_HOST}${css_path}") && [ "$code" = "200" ] && break
            echo "asset attempt $i: HTTP $code — retrying"; sleep 5
          done
          [ "$code" = "200" ] || { echo "FAIL: stylesheet asset returned $code"; exit 1; }
          grep -q "@font-face" /tmp/site.css
          for origin in "fonts.googleapis.com" "fonts.gstatic.com" "fontshare"; do
            if grep -qF "$origin" /tmp/home.html || grep -qF "$origin" /tmp/site.css; then
              echo "FAIL: third-party font origin '$origin' is back in the shipped page"; exit 1
            fi
          done
          # NOT `! grep …`: POSIX says set -e is ignored for a pipeline
          # beginning with `!`, so that form reports success no matter what and
          # the assertion becomes decoration. Test explicitly and exit.
          #
          # Clash Display and Satoshi were dropped because their Slovenian
          # coverage could not be proven; if either name reappears, so has the
          # bug that put čšž at risk.
          for dead in "Clash Display" "Satoshi"; do
            if grep -qF "$dead" /tmp/home.html || grep -qF "$dead" /tmp/site.css; then
              echo "FAIL: unverified face '$dead' is in the shipped page"; exit 1
            fi
          done

          # Slovenian actually renders as Slovenian, not as escapes or tofu.
          grep -q "montaža" /tmp/home.html

          # CSS comments are stripped before the wire. They were 43% of the
          # sheet — now a cacheable file, still worth not shipping.
          if grep -qF "/*" /tmp/site.css; then
            echo "FAIL: CSS comments are reaching the wire"; exit 1
          fi

          # Static assets actually serve. This is a new binding, and a
          # misconfigured one fails silently: the Worker still renders, every
          # <img> just 404s, and the page looks like the placeholders never
          # landed rather than like a broken deploy.
          # Retried, like the page check above. The asset store is eventually
          # consistent: wrangler reported "Uploaded 42 files" and this still
          # 404'd 0.4s later, because the deploy returns before the edge has
          # the objects. A single immediate request tests propagation speed,
          # not configuration.
          # The file is DERIVED from the checkout, never hardcoded. This check
          # named /img/motif-01.webp for weeks and then failed the deploy the
          # day that file was deleted — which is a broken assertion reported as
          # a broken deploy, the most expensive kind of false alarm. Asking the
          # repo what it actually ships cannot go stale.
          # ANY shipped asset, not specifically an image. The imagery moved to
          # Supabase and public/img emptied out, which would have made an
          # image-only check skip silently — leaving the binding unverified
          # exactly when the self-hosted FONTS became the only thing it
          # serves, and a page with no fonts is a page nobody can read.
          #
          # ⚠️ EXCEPT public/_headers AND public/_redirects. Those two are
          # CONFIGURATION, not content: Workers Assets parses them and then
          # refuses to serve them, by design and by documentation. Adding
          # _headers to public/ therefore failed this deploy on its first run
          # — the file sorts first, the check asked for it, the edge correctly
          # answered 404, and a working deploy was reported as a broken
          # binding. Deriving the name from the checkout is still right; the
          # derivation just has to know which files the platform eats.
          ASSET=$(cd public && find . -type f ! -name '.*' \
            ! -name '_headers' ! -name '_redirects' \
            | sed 's|^\./||' | sort | head -1)
          if [ -z "$ASSET" ]; then
            echo "public/ ships no files — nothing to check"
          else
            echo "asset check: /$ASSET"
            icode=000
            for i in 1 2 3 4 5 6; do
              icode=$(curl -s -o /tmp/asset.bin -w "%{http_code}" "https://${WORKERS_DEV_HOST}/$ASSET") || true
              [ "$icode" = "200" ] && break
              echo "asset attempt $i: HTTP $icode — retrying"; sleep 5
            done
            if [ "$icode" != "200" ]; then
              echo "FAIL: /$ASSET returned $icode after 6 attempts — assets are not serving"; exit 1
            fi
            # The binding's silent failure mode is the WORKER answering the
            # request instead of the asset store, which returns a page rather
            # than the file. Any HTML here means exactly that.
            if head -c 400 /tmp/asset.bin | grep -qi "<!doctype html\|<html"; then
              echo "FAIL: /$ASSET came back as HTML — the Worker answered instead of the asset store"
              head -c 200 /tmp/asset.bin; exit 1
            fi
            # And it must match the bytes the repo shipped.
            if ! cmp -s /tmp/asset.bin "public/$ASSET"; then
              echo "FAIL: /$ASSET does not match the file in the repo"; exit 1
            fi
          fi

          # public/_headers actually parsed. It is unserved config, so nothing
          # above can see it, and its whole failure mode is silence: a
          # malformed line is skipped, the platform default
          # ("max-age=0, must-revalidate") stays, and the six vendored faces
          # get revalidated on every navigation forever. Nobody would notice.
          #
          # The font is derived, like the asset above. Checked only when the
          # repo ships both the file and a rule for it, so deleting either one
          # retires the assertion instead of breaking the deploy.
          FONT=$(cd public && find fonts -type f -name '*.woff2' 2>/dev/null | sort | head -1)
          if [ -n "$FONT" ] && grep -q '^/fonts/\*' public/_headers 2>/dev/null; then
            echo "_headers check: /$FONT"
            # `|| true` because the step runs under `bash -e` and grep exits
            # 1 when the header is absent — which is precisely the failure
            # this is here to REPORT, and without it the step would die
            # silently on the assignment instead of printing why.
            fcc=$(curl -sI "https://${WORKERS_DEV_HOST}/$FONT" \
              | tr -d '\r' | grep -i '^cache-control:' | head -1 || true)
            case "$fcc" in
              *max-age=604800*) echo "  $fcc" ;;
              *) echo "FAIL: /$FONT sent \"$fcc\" — public/_headers did not apply"; exit 1 ;;
            esac
          fi

          # Assets must not shadow the page routes.
          grep -q 'data-theme="studio"' /tmp/home.html

          echo "smoke OK"
